# An AI assistant for Telegram on aiogram 3 that answers through any
# OpenAI-compatible Chat Completions API, built by the Dockerfile next to this
# file. Settings are Variables of the app (TELEGRAM_BOT_TOKEN, OPENAI_API_KEY,
# OPENAI_BASE_URL, MODEL, ALLOWED_USER_IDS, DATABASE_URL, ...): see bot.py.
# In this stack, ../inquir-compose.yaml sets them from the inputs and wires
# DATABASE_URL to the stack's PostgreSQL. The folder still deploys alone with
# `inquir apps deploy`.
version: 1
services:
  web:
    build:
      dockerfile: Dockerfile
    # Telegram bots run in the Netherlands (Telegram-боты размещаются в Нидерландах).
    location: nl
    # A polling bot must not scale to zero: it has no incoming requests to wake it.
    scaling:
      activation: always
    # No public address: the bot connects to Telegram itself (long polling).
    networkPolicy:
      ingress: private
    runtime:
      # GET /healthz answers 200 once Telegram accepted the token; in webhook
      # mode Telegram posts updates to this port too.
      port: 8080
      resources:
        memoryMb: 256
        cpuVCpus: 0.25
      healthcheck:
        type: http
        path: /healthz
        intervalSeconds: 30
        timeoutSeconds: 3
      # One bot instance at a time: Telegram answers 409 Conflict to a second
      # one polling the same token, so a redeploy stops the old one first.
      deployStrategy: recreate
