# A bot for the MAX messenger on the official SDK (@maxhub/max-bot-api),
# built by the Dockerfile next to this file. Settings are Variables of the app
# (MAX_BOT_TOKEN, BOT_MODE, WEBHOOK_URL, DATABASE_URL): see bot.mjs.
# Location: MAX is a Russian service, so this bot runs in Russia. The location is
# a setting of the app, not of this file: set it once with
# `inquir apps update <app> --location ru` (or Settings -> Scale -> Region in the
# dashboard) before the first deploy.
version: 1
services:
  web:
    build:
      dockerfile: Dockerfile
    runtime:
      # GET /healthz answers 200 once MAX accepted the token; in webhook mode
      # MAX posts updates to this port too.
      port: 8080
      resources:
        memoryMb: 256
        cpuVCpus: 0.25
      healthcheck:
        type: http
        path: /healthz
        intervalSeconds: 30
        timeoutSeconds: 3
      # One bot instance at a time, so two never share the update stream: a
      # redeploy stops the old one first.
      deployStrategy: recreate
