server {
    listen 8080;                 # the same port as runtime.port in inquir.yaml
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;

    # Compress text files. gzip_proxied is needed: requests reach nginx through a proxy.
    gzip on;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml text/plain;

    # Health check: the platform calls it before sending visitors to a new version.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Files in /assets/ have a hash in their names: browsers may keep them for a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Any other path: the file if it exists, otherwise index.html (React Router links work).
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
